<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Clima - Ñuble / Bío Bío</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Agente Clima Ñuble/Bío Bío</h1>
        
        <div class="selector-group">
            <select id="citySelect">
                <option value="lat=-36.60&lon=-72.10&name=Chillán">Chillán</option>
                <option value="lat=-36.82&lon=-73.05&name=Concepción">Concepción</option>
            </select>
            <button id="consultBtn" onclick="ejecutarAgente()">Consultar Agente</button>
        </div>

        <div id="errorMsg" class="error"></div>

       <div id="weatherDisplay" class="weather-info" style="display:none;">
            <h2 id="cityName"></h2>
            <div class="temperature" id="tempC"></div>
            <div class="condition" id="condText"></div>
            
            <!-- Panel extendido de métricas con iconos SVG limpios -->
            <div class="metrics-list">
                <div class="metric-row">
                    <span class="metric-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></span>
                    <span class="metric-label">Humedad</span>
                    <span class="metric-value" id="tempC">-</span>
                </div>
                <div class="metric-row">
                    <span class="metric-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg></span>
                    <span class="metric-label">Sensación</span>
                    <span class="metric-value" id="apparentTempVal">-</span>
                </div>
                <div class="metric-row">
                    <span class="metric-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></span>
                    <span class="metric-label">Precipitación</span>
                    <span class="metric-value"><span id="precipVal">-</span> mm</span>
                </div>
                <div class="metric-row">
                    <span class="metric-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19 12H2"/></svg></span>
                    <span class="metric-label">Viento / Ráfagas</span>
                    <span class="metric-value"><span id="windVal">-</span> / <span id="gustsVal">-</span> km/h</span>
                </div>
                <div class="metric-row">
                    <span class="metric-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2"><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg></span>
                    <span class="metric-label">Presión</span>
                    <span class="metric-value"><span id="pressureVal">-</span> hPa</span>
                </div>
                <div class="metric-row">
                    <span class="metric-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2"/></svg></span>
                    <span class="metric-label">Índice UV</span>
                    <span class="metric-value" id="uvVal">-</span>
                </div>
            </div>

            <div class="time-stamp" id="updateTime"></div>
            
            <div class="agent-box">
                <div id="agentTitle" class="agent-title">Agente de Clima (Cargando...)</div>
                <div id="agentRecommendation">Analizando datos meteorológicos...</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
