<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Clima - Ñuble / Bío Bío</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #a0a0a0;
            --background-color: #0d0d0d;
            --card-bg: #161616;
            --agent-bg: #1f1f1f;
            --border-color: #333333;
            --text-color: #f0f0f0;
            --error-color: #ff5555;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .container {
            max-width: 500px; width: 90%;
            padding: 30px;
            background-color: var(--card-bg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        h1 { text-align: center; margin-bottom: 20px; font-weight: 700; font-size: 1.8rem; color: var(--primary-color); }

        .selector-group {
            display: flex; gap: 10px; margin-bottom: 20px;
        }

        select, button {
            padding: 12px; font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        select { flex-grow: 1; font-family: inherit; outline: none; }

        button {
            background-color: var(--primary-color);
            color: var(--background-color);
            border: none;
            cursor: pointer; font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: #444444; color: #888888; cursor: not-allowed; }

        .weather-info {
            text-align: center; margin-top: 20px;
            padding: 20px; border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--background-color);
        }

        .temperature { font-size: 3rem; font-weight: 700; color: var(--primary-color); }
        .condition { font-size: 1.1rem; color: var(--secondary-color); }
        .time-stamp { font-size: 0.9rem; color: var(--secondary-color); margin-top: 5px; font-style: italic; }

        .agent-box {
            margin-top: 20px; padding: 15px;
            background-color: var(--agent-bg);
            border-left: 4px solid var(--primary-color);
            border-radius: 4px; font-size: 0.95rem; line-height: 1.5;
            white-space: pre-line; text-align: left;
        }

        .agent-title { font-weight: 700; margin-bottom: 8px; text-transform: uppercase; font-size: 0.8rem; color: var(--secondary-color); }
        .error { color: var(--error-color); text-align: center; margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Agente Clima Ñuble/Bío Bío</h1>
        
        <div class="selector-group">
            <select id="citySelect">
                <option value="lat=-36.60&lon=-72.10&name=Chillán">Chillán</option>
                <option value="lat=-36.82&lon=-73.05&name=Concepción">Concepción</option>
            </select>
            <button id="consultBtn" onclick="ejecutarAgente()">Consultar Agente</button>
        </div>

        <div id="errorMsg" class="error"></div>

        <div id="weatherDisplay" class="weather-info" style="display:none;">
            <h2 id="cityName"></h2>
            <div class="temperature" id="tempC"></div>
            <div class="condition" id="condText"></div>
            <div class="time-stamp" id="updateTime"></div>
            
            <div class="agent-box">
                <div class="agent-title">🤖 Recomendación del Agente (Gemma IA)</div>
                <div id="agentRecommendation">Analizando datos meteorológicos...</div>
            </div>
        </div>
    </div>

   <script>
    async function ejecutarAgente() {
        const btn = document.getElementById('consultBtn');
        const errorDiv = document.getElementById('errorMsg');
        const agentDiv = document.getElementById('agentRecommendation');
        
        btn.disabled = true;
        errorDiv.textContent = '';
        agentDiv.textContent = 'Generando décima del clima...';
        document.getElementById('weatherDisplay').style.display = 'block';

        try {
            const selectedValue = document.getElementById('citySelect').value;
            const params = new URLSearchParams(selectedValue);
            const lat = params.get('lat');
            const lon = params.get('lon');
            const nombreCiudad = params.get('name');

            // 1. Clima directo desde Open-Meteo
            const urlOpenMeteo = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m&timezone=auto&models=best_match`;
            
            const resWeather = await fetch(urlOpenMeteo);
            const dataWeather = await resWeather.json();

            const temp = dataWeather.current.temperature_2m;
            const humedad = dataWeather.current.relative_humidity_2m;

            const ahora = new Date();
            const horaFormateada = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            document.getElementById('cityName').textContent = nombreCiudad;
            document.getElementById('tempC').textContent = `${temp}°C`;
            document.getElementById('condText').textContent = `Humedad: ${humedad}%`;
            document.getElementById('updateTime').textContent = `Actualizado a las: ${horaFormateada}`;

            // 2. Consulta segura a nuestro Backend Serverless (Sin API Key expuesta)
            const resIA = await fetch('/api/agente', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nombreCiudad, temp, humedad })
            });

            const dataIA = await resIA.json();
            
            if (dataIA.choices && dataIA.choices[0] && dataIA.choices[0].message) {
                agentDiv.textContent = dataIA.choices[0].message.content;
            } else if (dataIA.error) {
                agentDiv.textContent = `Error del servidor: ${dataIA.error.message || JSON.stringify(dataIA.error)}`;
            } else {
                agentDiv.textContent = `Respuesta inesperada: ${JSON.stringify(dataIA)}`;
            }

        } catch (err) {
            errorDiv.textContent = 'Error de conexión: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
