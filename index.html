<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Clima - Ñuble / Bío Bío</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Agente Clima Ñuble/Bío Bío</h1>
        
        <div class="selector-group">
            <select id="citySelect">
                <option value="lat=-36.60&lon=-72.10&name=Chillán">Chillán</option>
                <option value="lat=-36.82&lon=-73.05&name=Concepción">Concepción</option>
            </select>
            <button id="consultBtn" onclick="ejecutarAgente()">Consultar Agente</button>
        </div>

        <div id="errorMsg" class="error"></div>

       <div id="weatherDisplay" class="weather-info" style="display:none;">
            <h2 id="cityName"></h2>
            <div class="temperature" id="tempC"></div>
            <div class="condition" id="condText"></div>
            
            <!-- Panel extendido de métricas físicas -->
            <div class="metrics-grid">
                <div>Sensación: <span id="apparentTempVal">-</span></div>
                <div>Precipitación: <span id="precipVal">-</span> mm</div>
                <div>Viento: <span id="windVal">-</span> km/h</div>
                <div>Ráfagas: <span id="gustsVal">-</span> km/h</div>
                <div>Presión: <span id="pressureVal">-</span> hPa</div>
                <div>Índice UV: <span id="uvVal">-</span></div>
            </div>

            <div class="time-stamp" id="updateTime"></div>
            
            <div class="agent-box">
                <div id="agentTitle" class="agent-title">Agente de Clima (Cargando...)</div>
                <div id="agentRecommendation">Analizando datos meteorológicos...</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
